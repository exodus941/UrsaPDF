name: Release APK

# Push a tag like v1.0.1; this builds a signed APK and attaches it to a GitHub release.
# The app's Check for Updates reads the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          URSA_KS_PASS: ${{ secrets.URSA_KS_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ursapdf.keystore
          export URSA_KS_PATH=ursapdf.keystore
          V="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName="$V" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "UrsaPDF-$V.apk"
      # The engine phones without built-in search and forms download on first launch.
      - name: Build and sign engine
        env:
          URSA_KS_PASS: ${{ secrets.URSA_KS_PASS }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bash engine/build.sh engine-out
          bash engine/sign.sh ursapdf.keystore "$URSA_KS_PASS" engine-out/*.zip
          rm -f ursapdf.keystore
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" UrsaPDF-*.apk engine-out/* --title "UrsaPDF ${GITHUB_REF_NAME}" --generate-notes
      # Only the newest release exists: every other release and its tag is deleted.
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              [ "$tag" = "$GITHUB_REF_NAME" ] && continue
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
